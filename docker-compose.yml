version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fortress
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always


  qdrant-db:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: always

  backend:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/fortress?schema=public
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant-db:6333
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app
    restart: on-failure

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  celery-worker:
    build: .
    command: celery -A app.worker.celery_app worker --concurrency=1 --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/fortress?schema=public
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant-db:6333
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
    volumes:
      - ./app:/app/app
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - BACKEND_API_URL=http://backend:8080
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  redis_data:
  qdrant_data: